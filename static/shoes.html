<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Shoes - SAADIA STORE</title>
  <link rel="stylesheet" href="Z.css">
</head>
<body>

  <!-- 🔹 Navbar -->
  <nav>
    <a href="index.html" class="nav-icon">
      <img src="../logo.jpg" alt="logo du site">
      <span>SAADIA-STORE</span>
    </a>
    <div class="main-navlinks">
      <div class="navlinks-container">
        <a href="#" data-section="home">Home</a>
        <a href="#" data-section="apropos">About</a>
        <a href="#" data-section="commande">Commande</a>
        <a href="#" data-section="any-gender">Any gender</a>
        <a href="#" data-section="men">Men</a>
      </div>
    </div>
  </nav>



  <button class="hamburger" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<!-- Barre verticale (mobile) -->
<div class="sidebar" id="sidebar">
  <a href="#" data-section="home">Home</a>
  <a href="#" data-section="apropos">About</a>
  <a href="#" data-section="commande">Commande</a>
  <a href="#" data-section="any-gender">Any gender</a>
  <a href="#" data-section="men">Men</a>
</div>
  <!-- 🔹 Bannière -->
  <section class="chaussure">
    <h3>Marchez avec style</h3>
  </section>

  <!-- 🔹 Accordions par marque -->
  <button class="accordion">nike</button>
  <section class="grid-container">
    <div class="grid-item">
      <img src="../nike1.jpg" alt="image d'icone pour la marque nike">
    </div>
  </section>

  <button class="accordion">adidas</button>
  <section class="grid-container">
   <div class="grid-item">
     <img src="../adidas1.jpg" alt="image d'icone pour la marque adidas">
        </div>

  </section>

  <button class="accordion">jordan</button>
  <section class="grid-container">
      <div class="grid-item">
        <img src="../jordan1.jpg" alt="image d'icone pour la marque jordan">
      </div>
  </section>

  <button class="accordion">force</button>
  <section class="grid-container">
    <div class="grid-item">
      <img src="../force1.jpg" alt="image d'icone pour la marque force">
    </div>
  </section>

  

  -<!-- Fenêtre modale produit -->
<div id="product-modal" class="modal hidden">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h3 id="product-name"></h3>
    <p id="product-price"></p>
    <button id="buy-btn">Acheter via WhatsApp</button>
  </div>
</div>


  <!-- Scripts -->
  <script src="script.js" defer></script>
  <script src="accordeon.js" defer></script>
  <script src="cache.js" defer></script>
  <script src="bouton.js" defer></script>
  <script src="shoes.js" defer></script>
</body>
</html>
