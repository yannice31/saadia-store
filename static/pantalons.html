    .pagination {
      text-align: center;

      padding: 8px 12px;
      margin: 0 5px;
      border: none;
      background: #333;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .pagination button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .pagination .page-number {
      background: #f4f4f4;
      color: #333;
    }
    .pagination .active {
      background: #92c3ee;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
